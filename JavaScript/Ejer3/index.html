<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cifrado César</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/app.js" defer></script>
</head>
<body>
    <main class="container">
        <h1>Cifrado César</h1>

        <label for="mensaje">Escribe tu frase:</label>
        <input type="text" id="mensaje" placeholder="hola mundo" autocomplete="off">

        <button id="btnCifrar">Cifrar</button>

        <div class="result-box">
            <p>Clave usada: <span id="claveDisplay"></span></p>
            <p>Mensaje cifrado: <strong id="resultado"></strong></p>
        </div>
    </main>
</body>
</html>
